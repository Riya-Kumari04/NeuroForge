spring.application.name=neuroforge-backend

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/neuroforge
spring.datasource.username=postgres
spring.datasource.password=Riya@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Server (auth + api on same port) ───────────────────────────────────────
server.port=8081

# ─── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=NeuroForgeSecretKey2024SuperSecureAtLeast256BitsLongForHS256Algorithm!
app.jwt.access-expiration=86400000
app.jwt.refresh-expiration=604800000

# ─── Mail (OTP) — replace with your Gmail App Password ──────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={USERNAME}
spring.mail.password={PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Swagger ────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

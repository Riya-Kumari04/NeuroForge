eureka:
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}


logging:
  level:
    web: TRACE
    org.springframework.web: TRACE
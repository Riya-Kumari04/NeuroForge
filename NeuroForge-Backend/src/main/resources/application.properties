spring.application.name=neuroforge-backend

# ─── Database ────────────────────────────────────────────────────────────────
# Override any of these with environment variables (DB_URL / DB_USERNAME / DB_PASSWORD)
# when running locally in VS Code, e.g. via a .env file loaded by your shell.
spring.datasource.url=jdbc:postgresql://localhost:5432/neuroforge
spring.datasource.username=postgres
spring.datasource.password=Riya@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Server (auth + api on same port) ───────────────────────────────────────
server.port=${PORT:8081}

# ─── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:NeuroForgeSecretKey2024SuperSecureAtLeast256BitsLongForHS256Algorithm!}
app.jwt.access-expiration=86400000
app.jwt.refresh-expiration=604800000

# ─── Mail (OTP / invitations) — set MAIL_USERNAME/MAIL_PASSWORD env vars ────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Swagger ────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Jackson ────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Frontend URL (used in invitation emails)
app.frontend.url=${FRONTEND_URL:http://localhost:5000}

# Pipeline failure rates (in percentage)
pipeline.failure-rate=20
pipeline.production-failure-rate=10


# Groq API Key
groq.api.key=${GROQ_API_KEY}
groq.model=llama-3.3-70b-versatile